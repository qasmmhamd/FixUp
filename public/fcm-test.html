<!DOCTYPE html>
<html>
<head>
  <title>FCM Test</title>
</head>

<body>

<button id="btn">Get Token</button>
<pre id="output"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getMessaging, 
    getToken, 
    onMessage 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyACXfzTll68-rbX7Q0qd7UCf96RroDJqyU",
  authDomain: "fixup-c687c.firebaseapp.com",
  projectId: "fixup-c687c",
  storageBucket: "fixup-c687c.firebasestorage.app",
  messagingSenderId: "43823771068",
  appId: "1:43823771068:web:d9bc0f522b0501b23e4fb9"
};

const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);

// 👇 (اختياري لكن مهم للتجربة)
onMessage(messaging, (payload) => {
    console.log("Foreground message:", payload);
});

document.getElementById("btn").addEventListener("click", async () => {

    try {

        console.log("Button clicked");

        // 1. طلب الإذن
        const permission = await Notification.requestPermission();
        console.log("Permission:", permission);

        if (permission !== "granted") {
            alert("Permission denied");
            return;
        }

        // 2. تسجيل Service Worker
        const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        console.log("SW registered");

        await navigator.serviceWorker.ready;

        // 3. جلب التوكن
        const token = await getToken(messaging, {
            vapidKey: "BMKK6CJLKM8Ww43BhpfOpKUpx5vNxHHAZhpBT9rq81kqfOaHii3SX3D-DS6dA8UcTmfIL5P_00bE9nph47K0chc",
            serviceWorkerRegistration: registration
        });

        console.log("TOKEN:", token);

        // 4. عرض التوكن
        if (token) {
            document.getElementById("output").innerText = token;
        } else {
            document.getElementById("output").innerText = "NO TOKEN GENERATED";
        }

    } catch (err) {
        console.error("ERROR:", err);
        document.getElementById("output").innerText = err.message;
    }
});

</script>

</body>
</html>
